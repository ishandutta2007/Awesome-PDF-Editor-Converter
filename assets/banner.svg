<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="40%" stop-color="#111827" />
      <stop offset="80%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Animated Mesh Gradient -->
    <radialGradient id="meshRed" cx="20%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="meshPurple" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="meshCyan" cx="50%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#fca5a5" />
      <stop offset="70%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <!-- Badge Gradients -->
    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="pillGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.1" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .bg-glow {
        animation: pulseGlow 8s ease-in-out infinite alternate;
      }
      .float-doc-1 {
        animation: floatItem 7s ease-in-out infinite alternate;
      }
      .float-doc-2 {
        animation: floatItemRev 9s ease-in-out infinite alternate;
      }
      .pulse-ring {
        animation: ringPulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .flow-line {
        stroke-dasharray: 8 12;
        animation: flowDash 20s linear infinite;
      }
      .orbit-particle {
        animation: orbit 14s linear infinite;
        transform-origin: 600px 180px;
      }

      @keyframes pulseGlow {
        0% { opacity: 0.6; transform: scale(0.98); }
        50% { opacity: 0.95; transform: scale(1.02); }
        100% { opacity: 0.7; transform: scale(0.99); }
      }
      @keyframes floatItem {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1.5deg); }
        100% { transform: translateY(4px) rotate(-1deg); }
      }
      @keyframes floatItemRev {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(12px) rotate(-2deg); }
        100% { transform: translateY(-6px) rotate(1deg); }
      }
      @keyframes ringPulse {
        0%, 100% { opacity: 0.3; transform: scale(0.96); }
        50% { opacity: 0.75; transform: scale(1.04); }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -400; }
      }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" rx="16" />

  <!-- Dynamic Glowing Aurora Blobs in Background (Non-intrusive) -->
  <g class="bg-glow">
    <circle cx="180" cy="90" r="240" fill="url(#meshRed)" />
    <circle cx="1020" cy="110" r="260" fill="url(#meshPurple)" />
    <circle cx="600" cy="300" r="200" fill="url(#meshCyan)" />
  </g>

  <!-- Decorative Circuit/Flow Lines in Background -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" fill="none" class="flow-line">
    <path d="M 50 180 Q 300 60, 600 180 T 1150 180" />
    <path d="M 100 240 Q 350 320, 600 240 T 1100 240" />
    <path d="M 50 100 Q 320 20, 600 100 T 1150 100" />
  </g>

  <!-- Left Background Floating Card (Subtle, Blurred, Behind Text) -->
  <g class="float-doc-1" opacity="0.35" transform="translate(60, 80)">
    <rect width="140" height="180" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.4" />
    <rect x="20" y="24" width="60" height="8" rx="4" fill="#ef4444" opacity="0.8" />
    <rect x="20" y="44" width="100" height="4" rx="2" fill="#94a3b8" opacity="0.5" />
    <rect x="20" y="56" width="90" height="4" rx="2" fill="#94a3b8" opacity="0.5" />
    <rect x="20" y="68" width="95" height="4" rx="2" fill="#94a3b8" opacity="0.5" />
    <rect x="20" y="80" width="75" height="4" rx="2" fill="#94a3b8" opacity="0.5" />
    <!-- Mini Stamp -->
    <rect x="20" y="105" width="45" height="20" rx="4" fill="#ef4444" opacity="0.4" />
    <path d="M 28 115 L 34 121 L 52 110" stroke="#fecaca" stroke-width="2" fill="none" stroke-linecap="round" />
  </g>

  <!-- Right Background Floating Card (Subtle, Behind Text) -->
  <g class="float-doc-2" opacity="0.35" transform="translate(1000, 70)">
    <rect width="140" height="180" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.4" />
    <rect x="20" y="24" width="70" height="8" rx="4" fill="#8b5cf6" opacity="0.8" />
    <rect x="20" y="44" width="100" height="4" rx="2" fill="#94a3b8" opacity="0.5" />
    <rect x="20" y="56" width="85" height="4" rx="2" fill="#94a3b8" opacity="0.5" />
    <rect x="20" y="68" width="95" height="4" rx="2" fill="#94a3b8" opacity="0.5" />
    <!-- Conversion Arrow Icon -->
    <circle cx="70" cy="120" r="22" fill="#8b5cf6" opacity="0.25" />
    <path d="M 62 120 L 78 120 M 73 115 L 78 120 L 73 125" stroke="#c4b5fd" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Foreground Dark Glass Backing for Crystal Clear Title Legibility -->
  <rect x="230" y="45" width="740" height="270" rx="20" fill="#090d16" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" filter="url(#shadow)" />

  <!-- Category Tag Pill (Top Center) -->
  <g transform="translate(485, 68)">
    <rect width="230" height="28" rx="14" fill="#ef4444" fill-opacity="0.18" stroke="#ef4444" stroke-opacity="0.6" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#ef4444" />
    <text x="30" y="19" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.5">CURATED AWESOME LIST</text>
  </g>

  <!-- Main Hero Icon (PDF Badge) -->
  <g transform="translate(565, 108)">
    <rect x="0" y="0" width="70" height="28" rx="6" fill="#dc2626" />
    <text x="35" y="19" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="1">PDF</text>
  </g>

  <!-- Foreground Title -->
  <text x="600" y="180" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" text-anchor="middle" letter-spacing="-0.5">
    Awesome PDF Editor &amp; Converter
  </text>

  <!-- Foreground Subtitle -->
  <text x="600" y="214" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" letter-spacing="0.2">
    Top SaaS Suites &amp; Open-Source Self-Hosted Document Toolkits
  </text>

  <text x="600" y="238" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">
    Local OCR • Browser-Local Conversion • Offline Security • Batch Manipulation
  </text>

  <!-- Feature Pills / Chips (Bottom Foreground) -->
  <g transform="translate(305, 264)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="32" rx="16" fill="url(#pillGrad1)" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1" />
      <text x="90" y="20" fill="#fecaca" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🛠️ Self-Hosted Tools</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(195, 0)">
      <rect width="195" height="32" rx="16" fill="url(#pillGrad2)" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1" />
      <text x="97" y="20" fill="#ddd6fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🔒 Privacy-First / Offline</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(405, 0)">
      <rect width="185" height="32" rx="16" fill="url(#pillGrad3)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
      <text x="92" y="20" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ High-Volume Batch</text>
    </g>
  </g>

</svg>
